<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Marathi - Cartoon Video</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #b8c0cc;
  margin-bottom: 25px;
}

.card {
  background: #1f2937;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 20px;
}

.upload {
  border: 2px dashed #60a5fa;
  padding: 30px 15px;
  text-align: center;
  border-radius: 15px;
  cursor: pointer;
}

.upload input {
  display: none;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 15px;
  cursor: pointer;
}

#createBtn {
  background: #22c55e;
  color: white;
}

#downloadBtn {
  background: #3b82f6;
  color: white;
  display: none;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  background: #111827;
  color: white;
  border: 1px solid #4b5563;
  margin-top: 10px;
}

video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  background: black;
}

#status {
  text-align: center;
  margin-top: 15px;
  color: #93c5fd;
}

canvas {
  display: none;
}
</style>
</head>

      <input type="file" id="videoInput" accept="video/*">

    <select id="style">

  <div class="card">

  </div>

</div>

<canvas id="canvas"></canvas>
